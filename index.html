<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://realcoolclint.github.io; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://raw.githubusercontent.com; media-src 'self' blob:; connect-src https://raw.githubusercontent.com https://api.github.com https://realcoolclint.github.io;">
    <script>
      const now = new Date();
      const jj = String(now.getDate()).padStart(2,'0');
      const mm = String(now.getMonth()+1).padStart(2,'0');
      const aa = String(now.getFullYear()).slice(-2);
      window.APP_VERSION = 'V1.' + jj + '.' + mm + '.' + aa;
    </script>
    <title>RENDEZVOUS — Portail Tranquility Suite</title>
    <link rel="stylesheet" href="https://realcoolclint.github.io/tranquility-core/tranquility-core.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1">
</head>
<body class="dark-theme">
    <div id="mercury-opening">
      <canvas id="mercury-grid"></canvas>
      <div class="mercury-center">
        <svg id="mercury-radar" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
          <circle cx="130" cy="130" r="115" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.2"
            stroke-dasharray="722" stroke-dashoffset="722" id="mercury-radar-circle"/>
        </svg>
        <!-- REPLACE: patch video src -->
        <video id="mercury-patch" src="" autoplay muted playsinline loop></video>
        <span id="mercury-version"></span>
      </div>
    </div>
    <div id="mercury-flash"></div>

    <div id="profile-selector-screen">
      <div id="ps-offline-badge" class="ps-offline-badge" hidden>HORS LIGNE</div>
      <div class="ps-card">
        <div class="ps-header">
          <!-- REPLACE: patch image src -->
          <img class="ps-app-patch" src="" alt="" />
          <div class="ps-app-name">RENDEZVOUS</div>
          <div class="ps-title">QUI SE CONNECTE ?</div>
        </div>
        <div id="ps-profiles-grid" class="ps-profiles-grid"></div>
        <div id="ps-empty-state" class="ps-empty-state" hidden>
          <p>Aucun profil disponible.<br>Vérifiez votre connexion Internet.</p>
        </div>
        <div class="ps-duration-section">
          <div class="ps-duration-label">RESTER CONNECTÉ :</div>
          <div class="ps-duration-options">
            <label class="ps-duration-option">
              <input type="radio" name="ps-duration" value="today" />
              <span class="ps-duration-btn">AUJOURD'HUI</span>
            </label>
            <label class="ps-duration-option">
              <input type="radio" name="ps-duration" value="7days" checked />
              <span class="ps-duration-btn">7 JOURS</span>
            </label>
            <label class="ps-duration-option">
              <input type="radio" name="ps-duration" value="always" />
              <span class="ps-duration-btn">TOUJOURS</span>
            </label>
          </div>
        </div>
        <button id="ps-connect-btn" class="ps-connect-btn" disabled>SE CONNECTER</button>
      </div>
    </div>

    <div class="app-container web-app">
        <header class="top-bar">
            <div class="top-bar-brand">
                <!-- REPLACE: patch -->
                <img class="app-patch-header" src="" alt="" />
                <h1>RENDEZVOUS</h1>
            </div>
            <nav class="top-bar-nav">
            </nav>
            <div class="top-bar-actions">
                <div class="top-bar-profile" id="top-bar-profile" style="display:none;">
                  <button class="profile-avatar-btn" id="profile-avatar-btn" title="Changer de profil">
                    <img id="header-profile-avatar" class="header-profile-avatar" src="" alt="" />
                    <div id="header-profile-fallback" class="header-profile-fallback" style="display:none;"></div>
                  </button>
                </div>
            </div>
        </header>
        <main class="main-content">
            <div id="mainView" class="view active">
                <p style="color: var(--text-secondary); font-family: 'Lato', sans-serif; text-transform: uppercase; letter-spacing: 0.1em;">PORTAIL EN CONSTRUCTION</p>
            </div>
        </main>
    </div>

    <script>
    (function() {
      const opening = document.getElementById('mercury-opening');
      const versionEl = document.getElementById('mercury-version');
      const radarCircle = document.getElementById('mercury-radar-circle');
      const flash = document.getElementById('mercury-flash');
      const canvas = document.getElementById('mercury-grid');
      const ctx = canvas.getContext('2d');

      if (versionEl) versionEl.textContent = window.APP_VERSION || '';

      function drawGrid() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const spacing = 28;
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        for (let x = 0; x < canvas.width; x += spacing) {
          for (let y = 0; y < canvas.height; y += spacing) {
            ctx.beginPath();
            ctx.arc(x, y, 0.8, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
      drawGrid();

      setTimeout(() => { opening.style.opacity = '1'; }, 180);
      setTimeout(() => {
        const patch = document.getElementById('mercury-patch');
        if (patch) patch.classList.add('visible');
      }, 550);

      setTimeout(() => {
        if (versionEl) versionEl.classList.add('visible');
      }, 1650);
      setTimeout(() => {
        radarCircle.style.transition = 'stroke-dashoffset 1.5s ease';
        radarCircle.style.strokeDashoffset = '0';
      }, 410);
      setTimeout(() => {
        flash.style.opacity = '1';
      }, 4000);
      setTimeout(() => {
        opening.style.display = 'none';
        flash.style.transition = 'opacity 0.5s ease-out';
        flash.style.opacity = '0';
        if (typeof window.onMercuryComplete === 'function') window.onMercuryComplete();
      }, 4230);
    })();
    </script>

    <!-- OPTIONNEL : Modale générique — décommenter si besoin
    <div class="modal" id="myModal">
      <div class="modal-content">
        <div class="modal-header"><h3>TITRE</h3></div>
        <div class="modal-body"></div>
        <div class="modal-footer"></div>
      </div>
    </div>
    -->

    <script src="app.js?v=1"></script>
</body>
</html>
